openapi: 3.0.3

info:
  title: Image Service API
  version: 2.0.0
  description: |
    Upload, catalogue, retrieve and delete images.

    Image bytes are stored in S3 and their metadata in DynamoDB. Each endpoint is
    backed by its own Lambda function behind API Gateway.

    ## Uploading

    Image bytes never pass through this API. An upload takes three steps:

    1. `POST /images` with the metadata. The response holds the image record
       (status `pending`) and a presigned S3 POST form.
    2. POST the file straight to S3 as `multipart/form-data`: every entry of
       `upload.fields` as a form field, then the file as the `upload.fileField`
       field, last. S3 enforces the signed policy - exact key, exact
       Content-Type, and a body of 1 byte up to `upload.maxSizeBytes` - and
       refuses anything else with `400` or `403` before storing a byte.
    3. S3 notifies an upload processor, which checks the file's magic bytes
       against `contentType`, measures and hashes it, and moves the image to
       `ready` (usually within a couple of seconds) or `rejected` with a
       `rejectionReason`. Poll `GET /images/{imageId}` to see the outcome.

    Only `ready` images are listed or downloadable. A `pending` image whose file
    never arrives expires automatically.

    Because the bytes bypass API Gateway and Lambda, uploads are not bound by
    their payload limits (10 MB and 6 MB). The size ceiling is a product limit,
    20 MB by default (`MAX_IMAGE_BYTES`), and is enforced by S3 itself: an
    oversized file is refused when uploaded, and the stored size is measured by
    the processor.

    ## Identity

    The calling user is taken from the `X-User-Id` header. This is a
    development-only stand-in: in a deployed environment an API Gateway
    authorizer supplies the identity, and the handlers already prefer
    `requestContext.authorizer.claims.sub` over the header, so no application
    change is needed when one is attached.

    ## Errors

    Every API failure returns the same body shape - a human-readable `error` and
    a stable machine-readable `code` - with an appropriate HTTP status. Failures
    on the direct S3 upload are S3's own XML error responses.
  contact:
    name: monty-cloud image service
  license:
    name: Assessment submission

servers:
  - url: http://localhost:4566/restapis/{restApiId}/{stage}/_user_request_
    description: LocalStack
    variables:
      restApiId:
        default: pcd01ggzi3
        description: Changes on every fresh deploy - take it from `terraform -chdir=terraform output -raw rest_api_id`.
      stage:
        default: local
  - url: https://{restApiId}.execute-api.{region}.amazonaws.com/{stage}
    description: AWS
    variables:
      restApiId:
        default: abc123xyz0
      region:
        default: us-east-1
      stage:
        default: dev

tags:
  - name: Images
    description: Image upload, search, retrieval and deletion.

security:
  - UserIdHeader: []

paths:
  /images:
    post:
      tags: [Images]
      summary: Register an image and get a direct-to-S3 upload form
      operationId: registerImage
      description: |
        Records the image's metadata with status `pending` and returns a
        presigned S3 POST form for the file itself. See **Uploading** above for
        the full flow.

        No bytes are sent in this request. The form accepts a file of
        1 byte up to `upload.maxSizeBytes`; S3 refuses anything larger with
        `400 EntityTooLarge`, so clients that want to fail before uploading
        should compare their file against `maxSizeBytes` themselves.

        Unknown body fields are rejected rather than ignored - in particular
        `imageBase64`, which earlier versions of this API accepted.
      security:
        - UserIdHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterImageRequest'
            examples:
              minimal:
                summary: Only the required fields
                value:
                  filename: sunset.png
                  contentType: image/png
              full:
                summary: With tags and a description
                value:
                  filename: sunset.png
                  contentType: image/png
                  tags: [beach, sunset]
                  description: Golden hour
      responses:
        '201':
          description: Registered. Upload the file with the returned form.
          headers:
            Location:
              description: Path of the image; poll it for the upload outcome.
              schema:
                type: string
                example: /images/334d3b476eba4fbfa2b00e2aa4792a8a
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AccessControlAllowOrigin'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterImageResponse'
              example:
                image:
                  imageId: 334d3b476eba4fbfa2b00e2aa4792a8a
                  userId: alice
                  filename: sunset.png
                  contentType: image/png
                  tags: [beach, sunset]
                  description: Golden hour
                  status: pending
                  createdAt: '2026-09-13T10:15:02.118Z'
                upload:
                  method: POST
                  url: http://localhost:4566/monty-images-local-bucket
                  fileField: file
                  maxSizeBytes: 20971520
                  fields:
                    Content-Type: image/png
                    key: images/alice/334d3b476eba4fbfa2b00e2aa4792a8a.png
                    x-amz-algorithm: AWS4-HMAC-SHA256
                    x-amz-credential: ASIAEXAMPLE/20260913/us-east-1/s3/aws4_request
                    x-amz-date: 20260913T101502Z
                    x-amz-security-token: IQoJb3JpZ2luX2VjEXAMPLE
                    policy: eyJleHBpcmF0aW9uIjogIjIwMjYtMDktMTNUMTA6MzA6MDJaIiwgImNvbmRpdGlvbnMiOiBbXX0=
                    x-amz-signature: 5f1c1b3f9d0a7e4c2b6a8d9e0f1a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c
                  expiresAt: '2026-09-13T10:30:02.118Z'
                  expiresInSeconds: 900
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/StorageError'

    get:
      tags: [Images]
      summary: List and search images
      operationId: listImages
      description: |
        Returns a page of `ready` images, newest first, with cursor pagination.
        Pending and rejected images are never listed.

        Stop paging when `nextToken` is `null`, never when a page is empty:
        `limit` bounds the rows read rather than the rows returned, so a page
        whose rows are all removed by a filter comes back empty while matches
        still wait behind the cursor.

        Filters combine with AND. Supplying `userId` queries the
        `userId-uploadedAt-index` GSI, and a date range then becomes a key
        condition rather than a post-read filter, so the query cost stays
        proportional to the number of results. Without `userId` there is no
        partition key to anchor on and the request falls back to a bounded,
        paginated Scan.
      security: []
      parameters:
        - $ref: '#/components/parameters/UserIdFilter'
        - $ref: '#/components/parameters/TagFilter'
        - $ref: '#/components/parameters/ContentTypeFilter'
        - $ref: '#/components/parameters/FilenameFilter'
        - $ref: '#/components/parameters/UploadedFrom'
        - $ref: '#/components/parameters/UploadedTo'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/NextToken'
      responses:
        '200':
          description: 'A page of results. An empty match set is a 200 with `items` empty.'
          headers:
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AccessControlAllowOrigin'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImagePage'
              examples:
                page:
                  summary: First page of two
                  value:
                    items:
                      - imageId: 0c758007aa834ae2a97f49b39d35039e
                        userId: carol
                        filename: surfboard.png
                        contentType: image/png
                        sizeBytes: 70
                        checksumSha256: c414cd0e204de974f73753c7e28d7638e7b3691bb8b1a2bab6b25bb7fed7ce77
                        tags: [beach, sports]
                        description: Board waxed and ready
                        status: ready
                        createdAt: '2026-09-13T10:15:07.402Z'
                        uploadedAt: '2026-09-13T10:15:08.960Z'
                    count: 1
                    nextToken: eyJpbWFnZUlkIjogIjBjNzU4MDA3YWE4MzRhZTJhOTdmNDliMzlkMzUwMzllIn0=
                lastPage:
                  summary: Last page - nextToken is null
                  value:
                    items: []
                    count: 0
                    nextToken: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/StorageError'

    options:
      tags: [Images]
      summary: CORS preflight
      operationId: preflightImages
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Preflight'

  /images/{imageId}:
    parameters:
      - $ref: '#/components/parameters/ImageId'

    get:
      tags: [Images]
      summary: View one image's metadata
      operationId: getImage
      description: |
        Returns the metadata record in any state. This is how a client learns the
        outcome of an upload: poll until `status` leaves `pending`. Storage-internal
        attributes are never exposed.
      security: []
      responses:
        '200':
          description: The image metadata.
          headers:
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AccessControlAllowOrigin'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Image'
              examples:
                pending:
                  summary: Registered, file not yet verified
                  value:
                    imageId: 334d3b476eba4fbfa2b00e2aa4792a8a
                    userId: alice
                    filename: sunset.png
                    contentType: image/png
                    tags: [beach, sunset]
                    status: pending
                    createdAt: '2026-09-13T10:15:02.118Z'
                ready:
                  summary: Upload verified
                  value:
                    imageId: 334d3b476eba4fbfa2b00e2aa4792a8a
                    userId: alice
                    filename: sunset.png
                    contentType: image/png
                    sizeBytes: 70
                    checksumSha256: c414cd0e204de974f73753c7e28d7638e7b3691bb8b1a2bab6b25bb7fed7ce77
                    tags: [beach, sunset]
                    status: ready
                    createdAt: '2026-09-13T10:15:02.118Z'
                    uploadedAt: '2026-09-13T10:15:03.874Z'
                rejected:
                  summary: Upload refused by the processor
                  value:
                    imageId: 334d3b476eba4fbfa2b00e2aa4792a8a
                    userId: alice
                    filename: not-really.png
                    contentType: image/png
                    tags: []
                    status: rejected
                    rejectionReason: "File content does not match the declared contentType 'image/png'"
                    createdAt: '2026-09-13T10:15:02.118Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/StorageError'

    delete:
      tags: [Images]
      summary: Delete an image
      operationId: deleteImage
      description: |
        Removes the metadata row and then the stored object, in any state. A
        pending image may have no object yet; that is fine.

        Deleting an image that is already gone returns `404`, not `204`. A client
        that deletes the wrong id should hear about it rather than be told the
        call succeeded.

        The metadata row is removed first because it is the source of truth for
        whether an image exists. If a file for a deleted image is uploaded
        afterwards, the processor finds no row and deletes the object, so a late
        upload cannot bring the image back.
      security:
        - UserIdHeader: []
      responses:
        '204':
          description: Deleted. No body.
          headers:
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AccessControlAllowOrigin'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/StorageError'

    options:
      tags: [Images]
      summary: CORS preflight
      operationId: preflightImage
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Preflight'

  /images/{imageId}/content:
    parameters:
      - $ref: '#/components/parameters/ImageId'

    get:
      tags: [Images]
      summary: View or download the image file
      operationId: downloadImage
      description: |
        Redirects to a short-lived presigned S3 URL, so the image bytes never
        pass through Lambda or API Gateway - no response payload cap, no compute
        time proportional to file size, and no double-billed transfer.

        The presigned URL carries a signed `Content-Type` and
        `Content-Disposition`, so the browser renders or saves the file under its
        original name.

        Only `ready` images have content. A pending or rejected image is a `409`.

        Clients that cannot follow redirects should pass `redirect=false` to get
        the URL as JSON instead.
      security: []
      parameters:
        - $ref: '#/components/parameters/Disposition'
        - $ref: '#/components/parameters/ExpiresIn'
        - $ref: '#/components/parameters/Redirect'
      responses:
        '302':
          description: Redirect to the presigned S3 URL. Returned unless `redirect=false`.
          headers:
            Location:
              description: Presigned S3 URL, valid for `expiresIn` seconds.
              schema:
                type: string
                format: uri
            Cache-Control:
              description: Always `no-store` - the URL expires and must not be cached.
              schema:
                type: string
                example: no-store
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AccessControlAllowOrigin'
        '200':
          description: Returned when `redirect=false`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadUrl'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ImageNotReady'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/StorageError'

components:
  securitySchemes:
    UserIdHeader:
      type: apiKey
      in: header
      name: X-User-Id
      description: |
        Development stand-in for an authenticated identity. Required on `POST
        /images` and `DELETE /images/{imageId}`. 1-128 characters of letters,
        digits, `.`, `_`, `@` or `-`, starting with a letter or digit - the value
        becomes part of the S3 object key. In a deployed environment an API
        Gateway authorizer replaces it and the header is ignored.

  headers:
    AccessControlAllowOrigin:
      description: CORS origin allowance. Currently `*`.
      schema:
        type: string
        example: '*'

  parameters:
    ImageId:
      name: imageId
      in: path
      required: true
      description: Server-generated image identifier (32 hex characters).
      schema:
        type: string
        pattern: '^[0-9a-f]{32}$'
      example: 334d3b476eba4fbfa2b00e2aa4792a8a

    UserIdFilter:
      name: userId
      in: query
      required: false
      description: |
        Restrict to one user's images. **Indexed** - this is the only filter that
        turns the request into a Query instead of a Scan, and it is what makes
        `uploadedFrom`/`uploadedTo` key conditions.
      schema:
        type: string
      example: alice

    TagFilter:
      name: tag
      in: query
      required: false
      description: Match a single tag. Case-insensitive; normalised the same way tags are on upload.
      schema:
        type: string
      example: beach

    ContentTypeFilter:
      name: contentType
      in: query
      required: false
      description: Exact match. An unsupported value is a `415`, not an empty result.
      schema:
        $ref: '#/components/schemas/ContentType'
      example: image/png

    FilenameFilter:
      name: filename
      in: query
      required: false
      description: Case-insensitive substring match on the original filename.
      schema:
        type: string
      example: sunset

    UploadedFrom:
      name: uploadedFrom
      in: query
      required: false
      description: Inclusive lower bound on `uploadedAt`, ISO-8601. Naive timestamps are read as UTC.
      schema:
        type: string
        format: date-time
      example: '2026-01-01T00:00:00Z'

    UploadedTo:
      name: uploadedTo
      in: query
      required: false
      description: Inclusive upper bound on `uploadedAt`, ISO-8601.
      schema:
        type: string
        format: date-time
      example: '2026-12-31T23:59:59Z'

    Limit:
      name: limit
      in: query
      required: false
      description: |
        Page size. Values above the maximum are capped, not rejected.

        This bounds the rows the database reads, not the rows returned: with a
        post-read filter (`tag`, `contentType`, `filename`) a page can come back
        empty and still carry a `nextToken`.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25

    NextToken:
      name: nextToken
      in: query
      required: false
      description: |
        Cursor from the previous response. Opaque - pass it back verbatim. A
        malformed token is a `400`.
      schema:
        type: string

    Disposition:
      name: disposition
      in: query
      required: false
      description: '`inline` renders in the browser; `attachment` prompts a save.'
      schema:
        type: string
        enum: [inline, attachment]
        default: inline

    ExpiresIn:
      name: expiresIn
      in: query
      required: false
      description: Lifetime of the presigned URL in seconds. Values above the maximum are capped.
      schema:
        type: integer
        minimum: 1
        maximum: 3600
        default: 900

    Redirect:
      name: redirect
      in: query
      required: false
      description: '`false` returns the URL as JSON instead of a `302`.'
      schema:
        type: boolean
        default: true

  schemas:
    ContentType:
      type: string
      description: Accepted image media types.
      enum:
        - image/jpeg
        - image/png
        - image/gif
        - image/webp

    ImageStatus:
      type: string
      description: |
        `pending` - registered, file not yet verified. `ready` - verified,
        listed and downloadable. `rejected` - the uploaded file failed
        verification; see `rejectionReason`.
      enum:
        - pending
        - ready
        - rejected

    RegisterImageRequest:
      type: object
      required: [filename, contentType]
      additionalProperties: false
      properties:
        filename:
          type: string
          minLength: 1
          maxLength: 255
          description: |
            Original file name. Any directory component is stripped before
            storage, so `../../etc/passwd.png` is recorded as `passwd.png`. The
            client never influences the S3 key.
          example: sunset.png
        contentType:
          $ref: '#/components/schemas/ContentType'
        tags:
          type: array
          maxItems: 20
          description: |
            Lowercased, trimmed and de-duplicated on write. A comma-separated
            string is also accepted. Each tag matches `[a-z0-9][a-z0-9_-]*`.
          items:
            type: string
            maxLength: 50
            pattern: '^[a-z0-9][a-z0-9_-]*$'
          example: [beach, sunset]
        description:
          type: string
          maxLength: 1024
          example: Golden hour

    RegisterImageResponse:
      type: object
      required: [image, upload]
      properties:
        image:
          $ref: '#/components/schemas/Image'
        upload:
          $ref: '#/components/schemas/UploadForm'

    UploadForm:
      type: object
      description: |
        A presigned S3 POST. Send `multipart/form-data` to `url` with every entry
        of `fields` as a form field, followed by the file as the `fileField`
        field - S3 requires the file to be the last field. The set of `fields`
        varies with the credentials that signed it (for example
        `x-amz-security-token` appears only for temporary credentials), so copy
        them all rather than naming them.
      required: [method, url, fields, fileField, maxSizeBytes, expiresAt, expiresInSeconds]
      properties:
        method:
          type: string
          enum: [POST]
        url:
          type: string
          format: uri
          description: The bucket endpoint to POST to.
          example: http://localhost:4566/monty-images-local-bucket
        fields:
          type: object
          description: Signed form fields, to be sent unchanged. Changing any of them invalidates the signature.
          required: [key, Content-Type, policy]
          additionalProperties:
            type: string
          properties:
            key:
              type: string
              example: images/alice/334d3b476eba4fbfa2b00e2aa4792a8a.png
            Content-Type:
              type: string
              example: image/png
            policy:
              type: string
              description: Base64 JSON policy fixing the key, the Content-Type and the allowed size range.
        fileField:
          type: string
          description: Name of the form field that must carry the file.
          example: file
        maxSizeBytes:
          type: integer
          description: |
            Largest file the form accepts. S3 refuses anything larger with
            `400 EntityTooLarge`; check the file against it before uploading to
            fail early.
          example: 20971520
        expiresAt:
          type: string
          format: date-time
          description: The form cannot be used after this instant.
          example: '2026-09-13T10:30:02.118Z'
        expiresInSeconds:
          type: integer
          example: 900

    Image:
      type: object
      description: |
        An image metadata record. Storage attributes (`s3Key`, `s3Bucket`) and the
        expiry timestamp exist on the stored item but are stripped from every
        response.

        `sizeBytes`, `checksumSha256` and `uploadedAt` are present only once the
        image is `ready`; `rejectionReason` only when it is `rejected`.
      required:
        - imageId
        - userId
        - filename
        - contentType
        - tags
        - status
        - createdAt
      properties:
        imageId:
          type: string
          pattern: '^[0-9a-f]{32}$'
          description: Server-generated. Two concurrent uploads never collide.
          example: 334d3b476eba4fbfa2b00e2aa4792a8a
        userId:
          type: string
          description: The uploader, taken from the authorizer or `X-User-Id`.
          example: alice
        filename:
          type: string
          example: sunset.png
        contentType:
          $ref: '#/components/schemas/ContentType'
        sizeBytes:
          type: integer
          description: Size of the stored file, measured by the processor. Ready images only.
          example: 70
        checksumSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: SHA-256 of the stored bytes, computed by the processor. Ready images only.
          example: c414cd0e204de974f73753c7e28d7638e7b3691bb8b1a2bab6b25bb7fed7ce77
        tags:
          type: array
          items:
            type: string
          example: [beach, sunset]
        description:
          type: string
          description: Present only when supplied at registration.
          example: Golden hour
        status:
          $ref: '#/components/schemas/ImageStatus'
        rejectionReason:
          type: string
          description: Why verification failed. Rejected images only.
          example: "File content does not match the declared contentType 'image/png'"
        createdAt:
          type: string
          format: date-time
          description: When the image was registered.
          example: '2026-09-13T10:15:02.118Z'
        uploadedAt:
          type: string
          format: date-time
          description: |
            When the upload was verified. Ready images only. UTC, millisecond
            precision, always `Z`-suffixed; this canonical form sorts
            lexicographically, which is what lets it serve as the GSI sort key
            and support range filters.
          example: '2026-09-13T10:15:03.874Z'

    ImagePage:
      type: object
      required: [items, count, nextToken]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Image'
        count:
          type: integer
          description: |
            Number of items in this page, not the total match count. May be 0
            while `nextToken` is non-null - do not use it to decide whether to
            stop paging.
          example: 1
        nextToken:
          type: string
          nullable: true
          description: |
            Cursor for the next page, or null on the last page. This is the only
            correct signal for whether more results exist.

    DownloadUrl:
      type: object
      required: [downloadUrl, expiresInSeconds, image]
      properties:
        downloadUrl:
          type: string
          format: uri
          description: Presigned S3 URL with signed response headers.
        expiresInSeconds:
          type: integer
          example: 900
        image:
          $ref: '#/components/schemas/Image'

    Error:
      type: object
      required: [error, code]
      properties:
        error:
          type: string
          description: Human-readable message. Safe to show a caller; never contains internals.
        code:
          type: string
          description: Stable identifier to branch on.
          enum:
            - ValidationError
            - NotFound
            - Conflict
            - ImageNotReady
            - UnsupportedMediaType
            - StorageError
            - InternalError

  responses:
    Preflight:
      description: CORS preflight, answered by a mock integration.
      headers:
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/AccessControlAllowOrigin'
        Access-Control-Allow-Methods:
          schema:
            type: string
            example: GET,POST,OPTIONS
        Access-Control-Allow-Headers:
          schema:
            type: string
            example: Content-Type,X-User-Id

    BadRequest:
      description: |
        The request failed validation: a malformed, missing, mistyped or unknown
        body field, an unparseable filter, a bad `nextToken`, or a missing or
        malformed caller identity.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            missingField:
              value:
                error: "'filename' is required"
                code: ValidationError
            wrongType:
              summary: tags sent as a number
              value:
                error: "'tags' must be an array of strings"
                code: ValidationError
            unknownField:
              summary: The retired base64 upload field
              value:
                error: 'Unknown field(s): imageBase64. Allowed: contentType, description, filename, tags'
                code: ValidationError
            badToken:
              value:
                error: "'nextToken' is not a valid pagination token"
                code: ValidationError
            noIdentity:
              value:
                error: 'Caller identity missing: supply the X-User-Id header'
                code: ValidationError

    NotFound:
      description: No image with that id.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Image '334d3b476eba4fbfa2b00e2aa4792a8a' was not found"
            code: NotFound

    Conflict:
      description: An image with that id already exists. Not reachable in normal use.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Image '334d3b476eba4fbfa2b00e2aa4792a8a' already exists"
            code: Conflict

    ImageNotReady:
      description: The image is pending or was rejected, so it has no content to serve.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            pending:
              value:
                error: "Image '334d3b476eba4fbfa2b00e2aa4792a8a' has not finished uploading"
                code: ImageNotReady
            rejected:
              value:
                error: "Image '334d3b476eba4fbfa2b00e2aa4792a8a' was rejected: File content does not match the declared contentType 'image/png'"
                code: ImageNotReady

    UnsupportedMediaType:
      description: '`contentType` is not an accepted image type.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "'contentType' must be one of: image/gif, image/jpeg, image/png, image/webp"
            code: UnsupportedMediaType

    StorageError:
      description: A downstream S3 or DynamoDB call failed. Retryable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Could not persist image metadata
            code: StorageError

    InternalError:
      description: |
        Unexpected failure. The message carries only a request id, which
        correlates with the CloudWatch log entry holding the stack trace.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 'Internal server error. Reference: 8f2c1a4e-6b9d-4c3a-9f11-2d7e5a0b4c88'
            code: InternalError
